name: Inspect professor-provided original artifacts
on:
  push:
    branches: ["research/authors-artifacts-20261014"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify metadata parsing
        run: python -m unittest discover -s tests -p 'test_source_metadata.py' -v
      - name: Retrieve publisher metadata and Zenodo file manifest
        run: |
          python scripts/inspect_provided_artifacts.py --output results/official_artifacts --download-under-mib 95
      - name: Audit official native benchmark and saved evaluation records
        run: |
          python -m unittest discover -s tests -p 'test_native_schema.py' -v
          python scripts/audit_original_archive.py --tar results/official_artifacts/SPDZCoder.tar --output results/official_artifacts/native_data_audit.json
      - name: Upload provenance record and safe archive file listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professor-provided-artifact-discovery
          path: |
            results/official_artifacts/source_manifest.json
            results/official_artifacts/native_data_audit.json
          retention-days: 30
          if-no-files-found: warn
