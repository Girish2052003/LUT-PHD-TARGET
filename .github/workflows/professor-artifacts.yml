name: Inspect professor-provided original artifacts
on:
  push:
    branches: ["main", "research/authors-artifacts-20261014"]
  pull_request:
    paths:
      - 'scripts/*official*'
      - 'scripts/*original*'
      - 'scripts/inspect_provided_artifacts.py'
      - 'scripts/check_handoff.py'
      - 'tests/**'
      - 'research/**'
      - 'README.md'
      - '.github/workflows/professor-artifacts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify regression suite and durable phase markers
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python scripts/check_handoff.py
      - name: Retrieve publisher metadata and Zenodo file manifest
        run: |
          python scripts/inspect_provided_artifacts.py --output results/official_artifacts --download-under-mib 95
      - name: Audit official native benchmark and saved evaluation records
        run: |
          python -m unittest discover -s tests -p 'test_native_schema.py' -v
          python scripts/audit_original_archive.py --tar results/official_artifacts/SPDZCoder.tar --output results/official_artifacts/native_data_audit.json
      - name: Recalculate published pass-at-k from authors' saved task flags
        run: |
          python -m unittest discover -s tests -p 'test_official_scores.py' -v
          python scripts/reproduce_official_scores.py --tar results/official_artifacts/SPDZCoder.tar --output results/official_artifacts/original_saved_evaluation_metrics.json
      - name: Audit original generated candidates for privacy review indicators
        run: |
          python -m unittest discover -s tests -p 'test_original_privacy_indicators.py' -v
          python scripts/audit_original_privacy_indicators.py --tar results/official_artifacts/SPDZCoder.tar --output results/official_artifacts/original_privacy_indicator_audit.json
      - name: Upload provenance record and safe archive file listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professor-provided-artifact-discovery
          path: |
            results/official_artifacts/source_manifest.json
            results/official_artifacts/native_data_audit.json
            results/official_artifacts/original_saved_evaluation_metrics.json
            results/official_artifacts/original_privacy_indicator_audit.json
          retention-days: 90
          if-no-files-found: error
