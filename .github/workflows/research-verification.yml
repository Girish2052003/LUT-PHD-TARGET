name: Research verification
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Re-run full deterministic experiment
        run: python scripts/run_experiments.py --output results/semantic
      - name: Audit raw observation consistency
        run: python scripts/verify_results.py --results results/semantic
      - name: Store executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-evidence
          path: results/semantic/
          retention-days: 30
          if-no-files-found: warn
